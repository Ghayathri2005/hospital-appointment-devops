---
- name: Configure Hospital Appointment Application
  hosts: local
  become: true

  tasks:
    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Install application dependencies
      pip:
        requirements: "{{ playbook_dir }}/../requirements.txt"
        virtualenv: "{{ playbook_dir }}/../ansible-venv"
        virtualenv_command: python3 -m venv
